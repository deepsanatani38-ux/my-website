<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club Registration</title>
<link rel="stylesheet" href="club.css">
</head>
<body>

    <h2>Coding Club</h2>
    <a href="https://www.google.com" target="_blank">
        Visit Website
    </a>
    <h2>Upcoming Events</h2>

    <table border="1">
        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>

        <tr>
            <td>HTML Workshop</td>
            <td>12 Nov</td>
            <td>Lab 1</td>
        </tr>

        <tr>
            <td>Hackathon</td>
            <td>20 Nov</td>
            <td>Seminar Hall</td>
        </tr>

        <tr>
            <td colspan="3">Total events: 2</td>
        </tr>
    </table>
    <h1>Register</h1>

    <form action="#" method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Your name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="dob">Date of birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        Gender:
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        Interests:
        <input type="checkbox" id="web" name="interests" value="Web">
        <label for="web">Web</label>

        <input type="checkbox" id="dsa" name="interests" value="DSA">
        <label for="dsa">DSA</label>
        <br><br>

        <label for="branch">Branch:</label>
        <select id="branch" name="branch">
            <option value="BCA">BCA</option>
            <option value="BTech CSE">B.Tech CSE</option>
            <option value="BBA">BBA</option>
            <option value="MCA">MCA</option>
        </select>
        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message"
                  rows="4" cols="30"
                  placeholder="Enter your message"></textarea>
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
